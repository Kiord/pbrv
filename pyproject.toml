[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbrv"
version = "0.1.0"
description = "Real-time PBR viewer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kiord" }]
dependencies = [
  "numpy",
  "pyrr",
  "moderngl",
  "moderngl-window",
  "trimesh",
  "opencv-python",
]

[project.scripts]
pbrv = "pbrv.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Include shaders/icons in wheels
[tool.setuptools.package-data]
pbrv = [
  "resources/icons/**/*",
  "resources/shaders/**/*",
]
